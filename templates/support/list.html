{% extends "base.html" %}{% block title %}Réclamations{% endblock %}
{% block content %}<div class="panel"><div class="d-flex justify-content-between"><h1>Mes réclamations</h1><a class="btn btn-aesm align-self-center" href="{% url 'support:create' %}">Nouvelle réclamation</a></div>
{% for t in tickets %}<div class="item"><a href="{% url 'support:detail' t.pk %}">#{{ t.pk }} {{ t.subject }}</a> <span class="badge-s">{{ t.get_status_display }}</span></div>{% empty %}<p class="muted">Aucune réclamation.</p>{% endfor %}</div>{% endblock %}
