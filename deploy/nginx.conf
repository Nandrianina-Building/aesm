# Exemple de configuration Nginx (HTTPS via Certbot / Let's Encrypt)
# Limitation de débit des points d'authentification (zone partagée, 10 requêtes/minute/IP) - NON TESTÉ (nginx absent lors de l'audit)
limit_req_zone $binary_remote_addr zone=aesm_auth:10m rate=10r/m;
server {
    listen 80;
    server_name aesm.example.mg;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name aesm.example.mg;
    # ssl_certificate /etc/letsencrypt/live/aesm.example.mg/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aesm.example.mg/privkey.pem;
    client_max_body_size 12M;
    server_tokens off;

    # Vitesse : compression des réponses texte
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    location /static/ { alias /srv/aesm/staticfiles/; expires 30d; add_header Cache-Control "public, immutable"; }   # CSS/JS versionnés par ?v=
    location /media/  { alias /srv/aesm/media/; expires 30d; add_header Cache-Control "public"; }      # images publiques uniquement
    # IMPORTANT : ne jamais exposer /srv/aesm/private/ (fichiers privés servis par Django après contrôle d'accès)

    location ~ ^/(compte/connexion|compte/inscription|compte/mot-de-passe-oublie|admin-aesm/login)/$ {
        limit_req zone=aesm_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;   # écrase toute valeur fournie par le client
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
